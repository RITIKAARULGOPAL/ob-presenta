<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#fcfcfb"/><g font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><text x="80" y="96" font-size="44" fill="#1a1a1a" font-weight="600" text-anchor="start">Contemporary / Minimal</text><text x="80" y="136" font-size="21" fill="#6b6b6b" font-weight="400" text-anchor="start">Reduce to essentials; let proportion and light do the work.</text><rect x="80" y="200" width="225" height="260" fill="#FFFFFF" stroke="#d9d9d9" stroke-width="1" rx="8" opacity="1"/><text x="80" y="486" font-size="15" fill="#6b6b6b" font-weight="400" text-anchor="start">#FFFFFF</text><rect x="325" y="200" width="225" height="260" fill="#F2F2F0" stroke="#d9d9d9" stroke-width="1" rx="8" opacity="1"/><text x="325" y="486" font-size="15" fill="#6b6b6b" font-weight="400" text-anchor="start">#F2F2F0</text><rect x="570" y="200" width="225" height="260" fill="#D8D8D5" stroke="#d9d9d9" stroke-width="1" rx="8" opacity="1"/><text x="570" y="486" font-size="15" fill="#6b6b6b" font-weight="400" text-anchor="start">#D8D8D5</text><rect x="815" y="200" width="225" height="260" fill="#9A9A97" stroke="#d9d9d9" stroke-width="1" rx="8" opacity="1"/><text x="815" y="486" font-size="15" fill="#6b6b6b" font-weight="400" text-anchor="start">#9A9A97</text><rect x="1060" y="200" width="225" height="260" fill="#3A3A38" stroke="#d9d9d9" stroke-width="1" rx="8" opacity="1"/><text x="1060" y="486" font-size="15" fill="#6b6b6b" font-weight="400" text-anchor="start">#3A3A38</text><rect x="1305" y="200" width="225" height="260" fill="#111111" stroke="#d9d9d9" stroke-width="1" rx="8" opacity="1"/><text x="1305" y="486" font-size="15" fill="#6b6b6b" font-weight="400" text-anchor="start">#111111</text><text x="80" y="560" font-size="17" fill="#6b6b6b" font-weight="600" text-anchor="start">Materials</text><text x="230" y="560" font-size="18" fill="#1a1a1a" font-weight="400" text-anchor="start">Micro-cement, matt laminate, glass, powder-coated steel, terrazzo</text><text x="80" y="608" font-size="17" fill="#6b6b6b" font-weight="600" text-anchor="start">Lighting</text><text x="230" y="608" font-size="18" fill="#1a1a1a" font-weight="400" text-anchor="start">Linear recessed, concealed cove, minimal fittings</text><text x="80" y="656" font-size="17" fill="#6b6b6b" font-weight="600" text-anchor="start">Imagery</text><text x="230" y="656" font-size="18" fill="#1a1a1a" font-weight="400" text-anchor="start">Clean wide shots, strong geometry, negative space, few props</text><text x="80" y="704" font-size="17" fill="#6b6b6b" font-weight="600" text-anchor="start">Watch out for</text><text x="230" y="704" font-size="18" fill="#1a1a1a" font-weight="400" text-anchor="start">Minimal shows every tolerance. Detail and site quality must be budgeted, or it reads cheap.</text></g></svg>