<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#fcfcfb"/><g font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><text x="80" y="96" font-size="44" fill="#1a1a1a" font-weight="600" text-anchor="start">Industrial / Raw</text><text x="80" y="136" font-size="21" fill="#6b6b6b" font-weight="400" text-anchor="start">Leave the building's structure and services legible.</text><rect x="80" y="200" width="225" height="260" fill="#4A4A47" stroke="#d9d9d9" stroke-width="1" rx="8" opacity="1"/><text x="80" y="486" font-size="15" fill="#6b6b6b" font-weight="400" text-anchor="start">#4A4A47</text><rect x="325" y="200" width="225" height="260" fill="#6E6A63" stroke="#d9d9d9" stroke-width="1" rx="8" opacity="1"/><text x="325" y="486" font-size="15" fill="#6b6b6b" font-weight="400" text-anchor="start">#6E6A63</text><rect x="570" y="200" width="225" height="260" fill="#8C7B6B" stroke="#d9d9d9" stroke-width="1" rx="8" opacity="1"/><text x="570" y="486" font-size="15" fill="#6b6b6b" font-weight="400" text-anchor="start">#8C7B6B</text><rect x="815" y="200" width="225" height="260" fill="#A85B3C" stroke="#d9d9d9" stroke-width="1" rx="8" opacity="1"/><text x="815" y="486" font-size="15" fill="#6b6b6b" font-weight="400" text-anchor="start">#A85B3C</text><rect x="1060" y="200" width="225" height="260" fill="#2B2B29" stroke="#d9d9d9" stroke-width="1" rx="8" opacity="1"/><text x="1060" y="486" font-size="15" fill="#6b6b6b" font-weight="400" text-anchor="start">#2B2B29</text><rect x="1305" y="200" width="225" height="260" fill="#D6CFC4" stroke="#d9d9d9" stroke-width="1" rx="8" opacity="1"/><text x="1305" y="486" font-size="15" fill="#6b6b6b" font-weight="400" text-anchor="start">#D6CFC4</text><text x="80" y="560" font-size="17" fill="#6b6b6b" font-weight="600" text-anchor="start">Materials</text><text x="230" y="560" font-size="18" fill="#1a1a1a" font-weight="400" text-anchor="start">Exposed soffit and services, mild steel, reclaimed timber, brick</text><text x="80" y="608" font-size="17" fill="#6b6b6b" font-weight="600" text-anchor="start">Lighting</text><text x="230" y="608" font-size="18" fill="#1a1a1a" font-weight="400" text-anchor="start">Suspended track and industrial fittings, visible conduit</text><text x="80" y="656" font-size="17" fill="#6b6b6b" font-weight="600" text-anchor="start">Imagery</text><text x="230" y="656" font-size="18" fill="#1a1a1a" font-weight="400" text-anchor="start">Exposed ceilings, structure close-ups, high-contrast shots</text><text x="80" y="704" font-size="17" fill="#6b6b6b" font-weight="600" text-anchor="start">Watch out for</text><text x="230" y="704" font-size="18" fill="#1a1a1a" font-weight="400" text-anchor="start">Exposed soffits wreck acoustics and raise HVAC load. Show the acoustic compensation in the</text><text x="230" y="730" font-size="18" fill="#1a1a1a" font-weight="400" text-anchor="start">same breath.</text></g></svg>