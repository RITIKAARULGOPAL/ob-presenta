<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#fcfcfb"/><g font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><text x="80" y="96" font-size="44" fill="#1a1a1a" font-weight="600" text-anchor="start">Warm Minimal (Japandi)</text><text x="80" y="136" font-size="21" fill="#6b6b6b" font-weight="400" text-anchor="start">Minimal discipline, warmed by timber, texture and softness.</text><rect x="80" y="200" width="225" height="260" fill="#E8DFD2" stroke="#d9d9d9" stroke-width="1" rx="8" opacity="1"/><text x="80" y="486" font-size="15" fill="#6b6b6b" font-weight="400" text-anchor="start">#E8DFD2</text><rect x="325" y="200" width="225" height="260" fill="#D6C7B0" stroke="#d9d9d9" stroke-width="1" rx="8" opacity="1"/><text x="325" y="486" font-size="15" fill="#6b6b6b" font-weight="400" text-anchor="start">#D6C7B0</text><rect x="570" y="200" width="225" height="260" fill="#B9A68C" stroke="#d9d9d9" stroke-width="1" rx="8" opacity="1"/><text x="570" y="486" font-size="15" fill="#6b6b6b" font-weight="400" text-anchor="start">#B9A68C</text><rect x="815" y="200" width="225" height="260" fill="#8A8379" stroke="#d9d9d9" stroke-width="1" rx="8" opacity="1"/><text x="815" y="486" font-size="15" fill="#6b6b6b" font-weight="400" text-anchor="start">#8A8379</text><rect x="1060" y="200" width="225" height="260" fill="#5A564E" stroke="#d9d9d9" stroke-width="1" rx="8" opacity="1"/><text x="1060" y="486" font-size="15" fill="#6b6b6b" font-weight="400" text-anchor="start">#5A564E</text><rect x="1305" y="200" width="225" height="260" fill="#FAF7F1" stroke="#d9d9d9" stroke-width="1" rx="8" opacity="1"/><text x="1305" y="486" font-size="15" fill="#6b6b6b" font-weight="400" text-anchor="start">#FAF7F1</text><text x="80" y="560" font-size="17" fill="#6b6b6b" font-weight="600" text-anchor="start">Materials</text><text x="230" y="560" font-size="18" fill="#1a1a1a" font-weight="400" text-anchor="start">Pale oak, linen, paper-effect surfaces, matt ceramic, rattan</text><text x="80" y="608" font-size="17" fill="#6b6b6b" font-weight="600" text-anchor="start">Lighting</text><text x="230" y="608" font-size="18" fill="#1a1a1a" font-weight="400" text-anchor="start">Warm, low-glare, generous indirect light</text><text x="80" y="656" font-size="17" fill="#6b6b6b" font-weight="600" text-anchor="start">Imagery</text><text x="230" y="656" font-size="18" fill="#1a1a1a" font-weight="400" text-anchor="start">Soft daylight, quiet compositions, texture and grain close-ups</text><text x="80" y="704" font-size="17" fill="#6b6b6b" font-weight="600" text-anchor="start">Watch out for</text><text x="230" y="704" font-size="18" fill="#1a1a1a" font-weight="400" text-anchor="start">Pale timber and linen mark and stain fast. Check the maintenance regime honestly before</text><text x="230" y="730" font-size="18" fill="#1a1a1a" font-weight="400" text-anchor="start">specifying.</text></g></svg>