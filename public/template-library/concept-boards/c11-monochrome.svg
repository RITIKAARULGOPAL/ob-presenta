<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#fcfcfb"/><g font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><text x="80" y="96" font-size="44" fill="#1a1a1a" font-weight="600" text-anchor="start">Monochrome / Editorial</text><text x="80" y="136" font-size="21" fill="#6b6b6b" font-weight="400" text-anchor="start">A gallery-like envelope that puts people and work in the frame.</text><rect x="80" y="200" width="225" height="260" fill="#000000" stroke="#d9d9d9" stroke-width="1" rx="8" opacity="1"/><text x="80" y="486" font-size="15" fill="#6b6b6b" font-weight="400" text-anchor="start">#000000</text><rect x="325" y="200" width="225" height="260" fill="#2B2B2B" stroke="#d9d9d9" stroke-width="1" rx="8" opacity="1"/><text x="325" y="486" font-size="15" fill="#6b6b6b" font-weight="400" text-anchor="start">#2B2B2B</text><rect x="570" y="200" width="225" height="260" fill="#5C5C5C" stroke="#d9d9d9" stroke-width="1" rx="8" opacity="1"/><text x="570" y="486" font-size="15" fill="#6b6b6b" font-weight="400" text-anchor="start">#5C5C5C</text><rect x="815" y="200" width="225" height="260" fill="#9E9E9E" stroke="#d9d9d9" stroke-width="1" rx="8" opacity="1"/><text x="815" y="486" font-size="15" fill="#6b6b6b" font-weight="400" text-anchor="start">#9E9E9E</text><rect x="1060" y="200" width="225" height="260" fill="#D6D6D6" stroke="#d9d9d9" stroke-width="1" rx="8" opacity="1"/><text x="1060" y="486" font-size="15" fill="#6b6b6b" font-weight="400" text-anchor="start">#D6D6D6</text><rect x="1305" y="200" width="225" height="260" fill="#FFFFFF" stroke="#d9d9d9" stroke-width="1" rx="8" opacity="1"/><text x="1305" y="486" font-size="15" fill="#6b6b6b" font-weight="400" text-anchor="start">#FFFFFF</text><text x="80" y="560" font-size="17" fill="#6b6b6b" font-weight="600" text-anchor="start">Materials</text><text x="230" y="560" font-size="18" fill="#1a1a1a" font-weight="400" text-anchor="start">Matt black metal, plaster, polished concrete, glass, neutral textile</text><text x="80" y="608" font-size="17" fill="#6b6b6b" font-weight="600" text-anchor="start">Lighting</text><text x="230" y="608" font-size="18" fill="#1a1a1a" font-weight="400" text-anchor="start">Gallery-grade track and accent lighting, high contrast</text><text x="80" y="656" font-size="17" fill="#6b6b6b" font-weight="600" text-anchor="start">Imagery</text><text x="230" y="656" font-size="18" fill="#1a1a1a" font-weight="400" text-anchor="start">High-contrast architectural photography, strong typography</text><text x="80" y="704" font-size="17" fill="#6b6b6b" font-weight="600" text-anchor="start">Watch out for</text><text x="230" y="704" font-size="18" fill="#1a1a1a" font-weight="400" text-anchor="start">High contrast is hard on screen work and on accessibility. Check luminance ratios at desks.</text></g></svg>