<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#fcfcfb"/><g font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><text x="80" y="96" font-size="44" fill="#1a1a1a" font-weight="600" text-anchor="start">Resimercial / Homely</text><text x="80" y="136" font-size="21" fill="#6b6b6b" font-weight="400" text-anchor="start">Use domestic comfort to make an office worth commuting to.</text><rect x="80" y="200" width="225" height="260" fill="#C97B5A" stroke="#d9d9d9" stroke-width="1" rx="8" opacity="1"/><text x="80" y="486" font-size="15" fill="#6b6b6b" font-weight="400" text-anchor="start">#C97B5A</text><rect x="325" y="200" width="225" height="260" fill="#E3C2A8" stroke="#d9d9d9" stroke-width="1" rx="8" opacity="1"/><text x="325" y="486" font-size="15" fill="#6b6b6b" font-weight="400" text-anchor="start">#E3C2A8</text><rect x="570" y="200" width="225" height="260" fill="#7A8B99" stroke="#d9d9d9" stroke-width="1" rx="8" opacity="1"/><text x="570" y="486" font-size="15" fill="#6b6b6b" font-weight="400" text-anchor="start">#7A8B99</text><rect x="815" y="200" width="225" height="260" fill="#4A4139" stroke="#d9d9d9" stroke-width="1" rx="8" opacity="1"/><text x="815" y="486" font-size="15" fill="#6b6b6b" font-weight="400" text-anchor="start">#4A4139</text><rect x="1060" y="200" width="225" height="260" fill="#D9CFC1" stroke="#d9d9d9" stroke-width="1" rx="8" opacity="1"/><text x="1060" y="486" font-size="15" fill="#6b6b6b" font-weight="400" text-anchor="start">#D9CFC1</text><rect x="1305" y="200" width="225" height="260" fill="#F5EFE7" stroke="#d9d9d9" stroke-width="1" rx="8" opacity="1"/><text x="1305" y="486" font-size="15" fill="#6b6b6b" font-weight="400" text-anchor="start">#F5EFE7</text><text x="80" y="560" font-size="17" fill="#6b6b6b" font-weight="600" text-anchor="start">Materials</text><text x="230" y="560" font-size="18" fill="#1a1a1a" font-weight="400" text-anchor="start">Upholstered seating, rugs, curtains, domestic-scale lighting, open shelving</text><text x="80" y="608" font-size="17" fill="#6b6b6b" font-weight="600" text-anchor="start">Lighting</text><text x="230" y="608" font-size="18" fill="#1a1a1a" font-weight="400" text-anchor="start">Layered lamps and pendants at domestic scale, warm temperature</text><text x="80" y="656" font-size="17" fill="#6b6b6b" font-weight="600" text-anchor="start">Imagery</text><text x="230" y="656" font-size="18" fill="#1a1a1a" font-weight="400" text-anchor="start">Lounge settings, soft seating vignettes, people at ease</text><text x="80" y="704" font-size="17" fill="#6b6b6b" font-weight="600" text-anchor="start">Watch out for</text><text x="230" y="704" font-size="18" fill="#1a1a1a" font-weight="400" text-anchor="start">Domestic fabrics fail commercial abrasion and fire ratings. Specify contract-grade</text><text x="230" y="730" font-size="18" fill="#1a1a1a" font-weight="400" text-anchor="start">equivalents.</text></g></svg>