<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#fcfcfb"/><g font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><text x="80" y="96" font-size="44" fill="#1a1a1a" font-weight="600" text-anchor="start">Access hierarchy</text><text x="80" y="136" font-size="21" fill="#6b6b6b" font-weight="400" text-anchor="start">Public, staff and restricted — and where the boundaries sit</text><rect x="220" y="230" width="1160" height="420" fill="#2a78d6" stroke="none" stroke-width="2" rx="12" opacity="0.14"/><rect x="220" y="230" width="1160" height="420" fill="none" stroke="#2a78d6" stroke-width="3" rx="12" opacity="1"/><text x="244" y="268" font-size="24" fill="#1a1a1a" font-weight="600" text-anchor="start">Public</text><rect x="370" y="290" width="860" height="300" fill="#1baf7a" stroke="none" stroke-width="2" rx="12" opacity="0.14"/><rect x="370" y="290" width="860" height="300" fill="none" stroke="#1baf7a" stroke-width="3" rx="12" opacity="1"/><text x="394" y="328" font-size="24" fill="#1a1a1a" font-weight="600" text-anchor="start">Staff</text><rect x="520" y="350" width="560" height="180" fill="#eb6834" stroke="none" stroke-width="2" rx="12" opacity="0.14"/><rect x="520" y="350" width="560" height="180" fill="none" stroke="#eb6834" stroke-width="3" rx="12" opacity="1"/><text x="544" y="388" font-size="24" fill="#1a1a1a" font-weight="600" text-anchor="start">Restricted</text><text x="220" y="720" font-size="19" fill="#6b6b6b" font-weight="400" text-anchor="start">Each boundary is an access-control point — name the credential at each one</text></g></svg>