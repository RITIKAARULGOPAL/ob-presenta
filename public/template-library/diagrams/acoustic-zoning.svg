<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#fcfcfb"/><g font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><text x="80" y="96" font-size="44" fill="#1a1a1a" font-weight="600" text-anchor="start">Acoustic zoning</text><text x="80" y="136" font-size="21" fill="#6b6b6b" font-weight="400" text-anchor="start">Loud to silent, planned rather than patched</text><rect x="80" y="250" width="340" height="300" fill="#eb6834" stroke="none" stroke-width="2" rx="10" opacity="0.16"/><rect x="80" y="250" width="340" height="300" fill="none" stroke="#eb6834" stroke-width="3" rx="10" opacity="1"/><text x="104" y="310" font-size="24" fill="#1a1a1a" font-weight="600" text-anchor="start">Social / café</text><text x="104" y="346" font-size="19" fill="#6b6b6b" font-weight="400" text-anchor="start">Loud</text><text x="104" y="500" font-size="18" fill="#1a1a1a" font-weight="400" text-anchor="start">NRC target 0.90</text><rect x="450" y="250" width="340" height="300" fill="#eda100" stroke="none" stroke-width="2" rx="10" opacity="0.16"/><rect x="450" y="250" width="340" height="300" fill="none" stroke="#eda100" stroke-width="3" rx="10" opacity="1"/><text x="474" y="310" font-size="24" fill="#1a1a1a" font-weight="600" text-anchor="start">Collaboration</text><text x="474" y="346" font-size="19" fill="#6b6b6b" font-weight="400" text-anchor="start">Active</text><text x="474" y="500" font-size="18" fill="#1a1a1a" font-weight="400" text-anchor="start">NRC target 0.80</text><rect x="820" y="250" width="340" height="300" fill="#2a78d6" stroke="none" stroke-width="2" rx="10" opacity="0.16"/><rect x="820" y="250" width="340" height="300" fill="none" stroke="#2a78d6" stroke-width="3" rx="10" opacity="1"/><text x="844" y="310" font-size="24" fill="#1a1a1a" font-weight="600" text-anchor="start">Open workspace</text><text x="844" y="346" font-size="19" fill="#6b6b6b" font-weight="400" text-anchor="start">Moderate</text><text x="844" y="500" font-size="18" fill="#1a1a1a" font-weight="400" text-anchor="start">NRC target 0.70</text><rect x="1190" y="250" width="340" height="300" fill="#1baf7a" stroke="none" stroke-width="2" rx="10" opacity="0.16"/><rect x="1190" y="250" width="340" height="300" fill="none" stroke="#1baf7a" stroke-width="3" rx="10" opacity="1"/><text x="1214" y="310" font-size="24" fill="#1a1a1a" font-weight="600" text-anchor="start">Focus / library</text><text x="1214" y="346" font-size="19" fill="#6b6b6b" font-weight="400" text-anchor="start">Silent</text><text x="1214" y="500" font-size="18" fill="#1a1a1a" font-weight="400" text-anchor="start">NRC target 0.60</text><text x="80" y="620" font-size="19" fill="#6b6b6b" font-weight="400" text-anchor="start">Exposed soffits remove the usual absorption — compensate or the open plan fails</text></g></svg>