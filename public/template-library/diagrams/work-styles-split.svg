<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#fcfcfb"/><g font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><text x="80" y="96" font-size="44" fill="#1a1a1a" font-weight="600" text-anchor="start">How work actually happens here</text><text x="80" y="136" font-size="21" fill="#6b6b6b" font-weight="400" text-anchor="start">The split the settings mix is sized against</text><path d="M 760.0 290.0 A 190 190 0 0 1 787.0 668.1 L 775.7 589.1 A 110 110 0 0 0 760.0 369.8 Z" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="1001.3834117356814" y="462.7359176657858" font-size="18" fill="#1a1a1a" font-weight="600" text-anchor="start">Focused</text><text x="1001.3834117356814" y="486.7359176657858" font-size="17" fill="#6b6b6b" font-weight="400" text-anchor="start">48%</text><path d="M 787.0 668.1 A 190 190 0 0 1 577.7 426.5 L 654.3 449.0 A 110 110 0 0 0 775.7 589.1 Z" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><text x="577.1086030062695" y="638.476297614759" font-size="18" fill="#1a1a1a" font-weight="600" text-anchor="end">Collaborative</text><text x="577.1086030062695" y="662.476297614759" font-size="17" fill="#6b6b6b" font-weight="400" text-anchor="end">32%</text><path d="M 577.7 426.5 A 190 190 0 0 1 760.0 290.0 L 760.0 369.8 A 110 110 0 0 0 654.3 449.0 Z" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><text x="614.974804704254" y="286.2690196963048" font-size="18" fill="#1a1a1a" font-weight="600" text-anchor="end">Meeting-heavy</text><text x="614.974804704254" y="310.2690196963048" font-size="17" fill="#6b6b6b" font-weight="400" text-anchor="end">20%</text><text x="1240" y="420" font-size="22" fill="#1a1a1a" font-weight="600" text-anchor="start">Measured, not assumed</text><text x="1240" y="454" font-size="18" fill="#6b6b6b" font-weight="400" text-anchor="start">Say plainly which one it is —</text><text x="1240" y="480" font-size="18" fill="#6b6b6b" font-weight="400" text-anchor="start">clients challenge assumed splits.</text></g></svg>